name: 'pytest report handler'
description: 'Save pytest report (junit) to GHA Artifacts'
inputs:
  workflow:
    description: "The workflow filename to fetch artifacts from"
    default: 
  action:
    description: "The action to take with the report (download / upload)"
    default: download
    required: true
  path:
    description: "The download path for reports"
    default: '.pytest-report'
    required: true
  src:
    description: "The report to upload. This will need to be renamed"
    required: true
  dest:
    description: "The report name that will be saved to GHA Artifacts. This is different due to test runners with multiple instances where we do not want it to overwrite."
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      run: mkdir .pytest_report

    - name: Get report artifact URL
      if: inputs.action != 'upload'
      id: 'get-artifact'
      uses: ./.github/action-download-workflow-artifact
      with:
        branch: master
        artifact: pytest-report
        workflow: ${{ inputs.workflow }}

    - name: Download report artifact
      shell: bash
      run: |
        wget -v --retry-connrefused --waitretry=1 --read-timeout=20 --timeout=15 -t 0 -O pytest-report.zip '${{ steps.get-artifact.outputs.url }}'
        mkdir -p .pytest-report || true
        unzip -q -d .pytest-report pytest-report.zip
        ls .pytest-report

    # Need to rename so if we have multiple test instances, the reports do not overwrite each other
    - name: Rename report
      if: inputs.action == 'upload'
      shell: bash
      run: mv ${{ inputs.src }} ${{ inputs.dest }}

    - name: Upload report
      if: inputs.action == 'upload'
      uses: actions/upload-artifact@v2
      with:
        name: pytest-report
        path: ${{ inputs.dest }}
